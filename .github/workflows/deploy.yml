# File:    .github/workflows/deploy.yml
# Purpose: On push to `prod`, build all three service images and push to GHCR,
#          then (with manual approval) deploy them to the production VPS by
#          pinning ALL services to this commit's exact SHA — never :latest.
# Owner:   Navanish
#
# How the production deploy works:
#   The build job tags each image with the 7-char commit SHA (and :latest).
#   The deploy job SSHes to the VPS and runs `/opt/skillship/deploy.sh <sha>`,
#   which pins backend + frontend + ai-service to that SAME SHA, pulls,
#   migrates, recreates, reloads nginx, and health-checks. Pinning one SHA for
#   all three services is what prevents the frontend/backend drift that hid
#   superadmin features on 2026-07-08 (frontend was stuck on a stale :latest).
#
# One-time setup required to turn auto-deploy ON:
#   1. Settings -> Environments -> `production`: add required reviewer(s) (this
#      is the "take permission" gate) plus these environment secrets:
#        - SSH_HOST         # 72.61.244.74
#        - SSH_USER         # root
#        - SSH_PRIVATE_KEY  # private key present in the VPS ~/.ssh/authorized_keys
#        - DEPLOY_DIR       # /opt/skillship   (must contain deploy.sh)
#   2. Settings -> Secrets and variables -> Actions -> Variables: AUTO_DEPLOY=true
#   3. Settings -> Actions -> General -> Workflow permissions: "Read and write"
#      so GITHUB_TOKEN can push images to GHCR.
#   Until (1)+(2) are done, the build job still runs and pushes images; the
#   deploy job is simply skipped (never fails).

name: Build & Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:        # also lets you re-run by hand

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # we don't want a newer push to abort an in-flight deploy

env:
  REGISTRY: ghcr.io
  # The image base name is derived from the repo path (e.g. ghcr.io/amfire-tech/skillship-backend).
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_REPO: ${{ github.event.repository.name }}

jobs:
  # ── 1. Build & push all three images to GHCR ────────────────────────────
  build:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
          - service: ai-service
            context: ai-service
            dockerfile: ai-service/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          OWNER_LOWER="$(echo '${{ env.IMAGE_OWNER }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LOWER="$(echo '${{ env.IMAGE_REPO }}' | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="${GITHUB_SHA::7}"
          BASE="${{ env.REGISTRY }}/${OWNER_LOWER}/${REPO_LOWER}-${{ matrix.service }}"
          echo "image_base=${BASE}" >> $GITHUB_OUTPUT
          echo "image_tag=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_base }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max
          # Frontend bakes NEXT_PUBLIC_* at build time. Override per environment
          # if staging and prod differ — for now they share one set, read from
          # repo-level variables. NEXT_PUBLIC_SITE_URL feeds og:image / sitemap /
          # robots; if the var is unset the Dockerfile defaults it to the prod
          # domain, so an empty value here can never bake in localhost.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}

  # ── 2. Auto-deploy main → staging ───────────────────────────────────────
  deploy-staging:
    name: Deploy → staging
    needs: build
    # Gated OFF until a VPS + SSH secrets exist. The build job above still runs
    # and pushes images to GHCR. To turn on auto-deploy later, add repo Variable
    # AUTO_DEPLOY=true (Settings → Secrets and variables → Actions → Variables).
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.skillship.in
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            git fetch --quiet origin prod
            git reset --hard origin/prod
            # Pull the freshly-built images CI just pushed.
            docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod pull
            # Apply Django migrations once before bringing the services up.
            # The backend image already has manage.py + code on board.
            docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod \
              run --rm backend python manage.py migrate --noinput
            docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d
            # Cull any old image layers to keep the VPS disk healthy.
            docker image prune -f --filter "until=168h"

      - name: Smoke test
        run: |
          set -e
          # Give the stack ~30s to settle (nginx waits on healthy backend+frontend).
          for i in $(seq 1 30); do
            if curl -fsS "https://staging.skillship.in/healthz/" >/dev/null; then
              echo "Staging healthz OK"
              exit 0
            fi
            sleep 5
          done
          echo "Staging never became healthy"
          exit 1

  # ── 3. Manual-approval deploy → production ─────────────────────────────
  deploy-production:
    name: Deploy → production (manual gate)
    needs: build            # runs straight off the images the build job pushed
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      # GitHub-side "required reviewers" on this environment is what makes this
      # job wait for a human click before deploying — the "take permission" gate.
      name: production
      url: https://skillship.in
    steps:
      - name: SSH deploy (pin all 3 services to this commit's SHA)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            # deploy.sh pins backend + frontend + ai-service to the SAME image
            # tag, pulls, migrates, recreates, reloads nginx and health-checks.
            # One command, no :latest drift. It exits non-zero on any failure,
            # which fails this job.
            bash "${{ secrets.DEPLOY_DIR }}/deploy.sh" "${{ needs.build.outputs.image_tag }}"

      - name: External smoke test
        run: |
          set -e
          # Independent public-reachability check (DNS + nginx + TLS) from the runner.
          for i in $(seq 1 30); do
            if curl -fsS "https://skillship.in/healthz/" >/dev/null; then
              echo "Production healthz OK"
              exit 0
            fi
            sleep 5
          done
          echo "Production never became healthy"
          exit 1
